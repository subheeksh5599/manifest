name: guards

on:
  push:
    paths:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No credentials in the tree
        run: python3 scripts/check_no_secrets.py --all
      - name: No build output committed
        run: |
          if git ls-files | grep -qE '^target/'; then
            echo "build output is tracked under target/:"
            git ls-files | grep -E '^target/'
            exit 1
          fi
          echo "no tracked build output"
