name: app

on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json
      - working-directory: app
        run: npm ci
      - working-directory: app
        run: npm test
      - working-directory: app
        run: npm run build
