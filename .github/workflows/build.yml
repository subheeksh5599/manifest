name: build

on: [push, pull_request]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx tsc --noEmit

  program:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anza-xyz/setup-solana@v1
        with:
          solana-version: "2.1.0"
      - run: cargo build-sbf --manifest-path programs/preflight/Cargo.toml
      - run: cargo test --manifest-path programs/preflight/Cargo.toml