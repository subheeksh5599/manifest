name: build

on: [push, pull_request]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx tsc --noEmit

  program:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: install solana
        shell: bash
        run: |
          curl -sSfL https://release.anza.xyz/v2.1.0/install | sh
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: build-sbf
        run: cargo build-sbf --manifest-path programs/preflight/Cargo.toml
      - name: test
        run: cargo test --manifest-path programs/preflight/Cargo.toml