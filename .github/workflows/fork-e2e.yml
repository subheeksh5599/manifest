name: fork-e2e

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "app/data/registry.json"
      - "app/lib/**"
      - ".github/workflows/fork-e2e.yml"

# Every published number, re-derived from mainnet in a clean container.
# The verifier is an independent implementation of the byte read, so this job
# catching a disagreement means the site is wrong, not the test.

jobs:
  clone-and-hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: verify receipts (independent re-derivation from raw account bytes)
        run: python3 scripts/verify_receipts.py --check
      - name: adversarial gate (ablation, tampered bytes, absent extension)
        run: python3 scripts/adversarial_gate.py
