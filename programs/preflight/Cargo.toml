[package]
name = "manifest-preflight"
version = "0.1.0"
description = "Preflight guard for tokenized equity buys"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "manifest_preflight"

[features]
no-entrypoint = []
no-idl = []
no-log-ix = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token-2022"] }
spl-token-2022 = { workspace = true }
spl-token = { workspace = true }
bytemuck = "1.16"