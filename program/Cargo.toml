[package]
name = "manifest-guard"
version = "0.1.0"
edition = "2021"
description = "Preflight guard program for scheduled tokenized-equity buys."
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "manifest_guard"

[features]
no-entrypoint = []

[dependencies]
solana-program = "1.18"
borsh = "1.5"
thiserror = "1"

[dev-dependencies]

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
